<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Space -->
  <circle cx="256" cy="256" r="244" fill="#0B1D3A"/>

  <!-- Stars -->
  <g fill="#E5E7EB">
    <circle cx="110" cy="130" r="3"/>
    <circle cx="170" cy="70" r="2"/>
    <circle cx="380" cy="90" r="2.5"/>
    <circle cx="430" cy="200" r="2"/>
    <circle cx="80" cy="300" r="2"/>
    <circle cx="140" cy="420" r="2.5"/>
    <circle cx="400" cy="400" r="2"/>
    <circle cx="300" cy="460" r="1.8"/>
    <circle cx="460" cy="320" r="1.5"/>
    <path d="M390 150 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z"/>
    <path d="M110 360 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z"/>
  </g>

  <!-- Tortoise, top-down, drifting -->
  <g transform="rotate(-25 256 256)" stroke="#1F2937" stroke-width="6" stroke-linejoin="round">
    <!-- Tail -->
    <path d="M244 362 L256 392 L268 362 Z" fill="#7A9A3A"/>
    <!-- Legs -->
    <ellipse cx="182" cy="192" rx="30" ry="18" transform="rotate(-35 182 192)" fill="#7A9A3A"/>
    <ellipse cx="330" cy="192" rx="30" ry="18" transform="rotate(35 330 192)" fill="#7A9A3A"/>
    <ellipse cx="184" cy="330" rx="28" ry="17" transform="rotate(35 184 330)" fill="#7A9A3A"/>
    <ellipse cx="328" cy="330" rx="28" ry="17" transform="rotate(-35 328 330)" fill="#7A9A3A"/>
    <!-- Head -->
    <ellipse cx="256" cy="132" rx="30" ry="36" fill="#7A9A3A"/>
    <!-- Shell -->
    <ellipse cx="256" cy="262" rx="92" ry="112" fill="#8B6B3D"/>
    <!-- Vertebral scutes -->
    <g fill="#A9824A" stroke="#3B2A17" stroke-width="4">
      <polygon points="228,214 242,190 270,190 284,214 270,238 242,238"/>
      <polygon points="228,262 242,238 270,238 284,262 270,286 242,286"/>
      <polygon points="228,310 242,286 270,286 284,310 270,334 242,334"/>
    </g>
    <!-- Costal scute lines -->
    <g stroke="#3B2A17" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M284 214 L336 204 M284 262 L348 262 M284 310 L336 320"/>
      <path d="M228 214 L176 204 M228 262 L164 262 M228 310 L176 320"/>
      <path d="M242 190 L234 152 M270 190 L278 152"/>
      <path d="M242 334 L236 372 M270 334 L276 372"/>
    </g>
  </g>

  <!-- Eyes (drawn unrotated positions mapped onto rotated head) -->
  <g transform="rotate(-25 256 256)" fill="#1F2937">
    <circle cx="244" cy="124" r="5"/>
    <circle cx="268" cy="124" r="5"/>
  </g>
</svg>
